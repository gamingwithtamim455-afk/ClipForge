name: Build Windows

# Windows 11 is the first target: builds a real .exe (PyInstaller) and an
# Inno Setup installer, and uploads both as artifacts.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Download bundled FFmpeg
        run: python tools/download_ffmpeg.py --platform win

      - name: Run tests (offscreen)
        # The job log needs sign-in to read, so on failure the failing
        # test names (or the startup error) are also emitted as
        # ::error:: annotations, visible on the public run page.
        # python -m pytest (not bare pytest) so the command cannot fail
        # on PATH lookup.
        run: |
          python -m pytest --version
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::python -m pytest --version failed, exit code $LASTEXITCODE"; exit $LASTEXITCODE }
          python -m pytest tests/ -q --tb=line -rf 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) {
            $code = $LASTEXITCODE
            $fails = Select-String -Path pytest-output.txt -Pattern '^FAILED ' | ForEach-Object { $_.Line }
            if ($fails) {
              foreach ($f in $fails) { Write-Output "::error::$f" }
            } else {
              Write-Output "::error::pytest exited with code $code and no FAILED lines in output (possible crash or collection error)"
              Get-Content pytest-output.txt -Tail 10 | ForEach-Object { Write-Output "::error::$_" }
            }
            exit $code
          }

      - name: Smoke-test the app (offscreen)
        run: |
          $env:CLIPFORGE_SMOKE_TEST = "1"
          python main.py

      - name: Build .exe with PyInstaller
        run: pyinstaller clipforge.spec --noconfirm

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc installer/clipforge.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipForge-Windows
          path: |
            dist/ClipForge.exe
            installer/Output/ClipForge-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release for this version (if new)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $init = Get-Content clipforge/__init__.py -Raw
          if ($init -notmatch '__version__\s*=\s*"([^"]+)"') { Write-Output "::error::version not found in clipforge/__init__.py"; exit 1 }
          $ver = "v" + $Matches[1]
          $existing = gh release list --json tagName | ConvertFrom-Json
          if ($existing.tagName -contains $ver) { Write-Output "Release $ver already exists - skipping."; exit 0 }
          $setup = "installer/Output/ClipForge-Setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          "$hash  ClipForge-Setup.exe" | Out-File -Encoding ascii "ClipForge-Setup.exe.sha256"
          gh release create $ver --title "ClipForge $ver" --notes "Download ClipForge-Setup.exe and run it to install. Future updates arrive inside the app via Settings > Updates." $setup "ClipForge-Setup.exe.sha256"
